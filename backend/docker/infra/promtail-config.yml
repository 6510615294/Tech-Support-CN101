server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - docker: {}

      - json:
          expressions:
            service: service
            level: level
            msg: msg
            method: method
            path: path
            status: status
            duration_ms: duration_ms
            request_id: request_id

      - labels:
          service:
          level:
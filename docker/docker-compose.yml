# =============================================================
#  Unified Docker Compose — Tech-Support-CN101
#  All services: backend (api + worker), frontend, postgres,
#  redis, minio, judge0, loki, promtail, grafana
# =============================================================

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

# ----------------------------- NETWORKS -----------------------
# "public"  → services exposed to the host / internet
# "private" → internal-only (judge0, redis, etc.)
x-networks: &default-networks
  networks:
    - public
    - private

services:
  # ========================= DATABASE =========================
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # =========================== REDIS ==========================
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    # No ports exposed — internal only
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # =========================== MINIO ==========================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # ======================= BACKEND API ========================
  api:
    build:
      context: ../backend
    container_name: go-api
    command: ["./server"]
    env_file: ../backend/.env
    ports:
      - "8080:8080"
    environment:
      - SERVICE_NAME=api
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable
      - REDIS_ADDRESS=redis:6379
      - JUDGE0_URL=http://judge0-server:2358
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - postgres
      - redis
      - minio
      - judge0-server
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # ====================== BACKEND WORKER ======================
  worker:
    build:
      context: ../backend
    container_name: go-worker
    command: ["./worker"]
    env_file: ../backend/.env
    environment:
      - SERVICE_NAME=worker
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}?sslmode=disable
      - REDIS_ADDRESS=redis:6379
      - JUDGE0_URL=http://judge0-server:2358
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - postgres
      - redis
      - minio
      - judge0-server
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # ========================= FRONTEND =========================
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # ===================== JUDGE0 SERVER ========================
  # NOT exposed to internet — only accessible internally
  judge0-server:
    image: judge0/judge0:latest
    container_name: judge0-server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    # No ports mapped to host
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # ===================== JUDGE0 WORKERS =======================
  judge0-workers:
    image: judge0/judge0:latest
    container_name: judge0-workers
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # ===================== JUDGE0 DATABASE ======================
  judge0-db:
    image: postgres:16.2
    container_name: judge0-db
    environment:
      POSTGRES_DB: ${JUDGE0_POSTGRES_DB:-judge0}
      POSTGRES_USER: ${JUDGE0_POSTGRES_USER:-judge0}
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0password}
    volumes:
      - judge0_pgdata:/var/lib/postgresql/data/
    # No ports exposed — internal only
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # ======================= JUDGE0 REDIS =======================
  judge0-redis:
    image: redis:7.2.4
    container_name: judge0-redis
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$JUDGE0_REDIS_PASSWORD"'
    ]
    environment:
      JUDGE0_REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0redispassword}
    # No ports exposed — internal only
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # =========================== LOKI ===========================
  loki:
    image: grafana/loki:main-7550b17
    container_name: loki
    # No ports exposed — accessed internally via grafana
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # ========================= PROMTAIL =========================
  promtail:
    image: grafana/promtail:3.6.10
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

  # ========================== GRAFANA =========================
  grafana:
    image: grafana/grafana:12.4-ubuntu
    container_name: grafana
    ports:
      - "3001:3000"        # Using 3001 to avoid clash with frontend on 3000
    depends_on:
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    restart: unless-stopped
    <<: [*default-logging, *default-networks]

# ========================== VOLUMES ===========================
volumes:
  pgdata:
  judge0_pgdata:
  minio_data:
  grafana_data:

# ========================== NETWORKS ==========================
networks:
  public:
    driver: bridge
  private:
    driver: bridge
